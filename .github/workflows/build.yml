name: Build FBDaw Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Scarica i sorgenti FBDaw
        uses: actions/checkout@v4

      - name: Scarica JUCE
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configura con CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compila (Release)
        run: cmake --build build --config Release

      - name: Raccogli l'eseguibile
        run: |
          mkdir artefatto
          copy "build\FBDaw_artefacts\Release\FBDaw.exe" artefatto\

      - name: Carica FBDaw.exe come download
        uses: actions/upload-artifact@v4
        with:
          name: FBDaw-Windows
          path: artefatto/FBDaw.exe
